name: Editorial publication CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: editorial-publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate editorial integration
        run: npm run editorial:test

      - name: Build production site
        run: npm run build
        env:
          VUE_APP_MAPTILER_KEY: ${{ secrets.MAPTILER_API_KEY }}
          VUE_APP_ADSENSE_ENABLED: ${{ vars.ADSENSE_ENABLED }}
          VUE_APP_ADSENSE_PRIVACY_READY: ${{ vars.ADSENSE_PRIVACY_READY }}
          VUE_APP_ADSENSE_AUTO_ADS_OFF_CONFIRMED: ${{ vars.ADSENSE_AUTO_ADS_OFF_CONFIRMED }}
          VUE_APP_ADSENSE_CLIENT_ID: ${{ vars.ADSENSE_CLIENT_ID }}
          VUE_APP_ADSENSE_STORY_SLOT_ID: ${{ vars.ADSENSE_STORY_SLOT_ID }}
          VUE_APP_ADSENSE_ATLAS_ENABLED: ${{ vars.ADSENSE_ATLAS_ENABLED }}
          VUE_APP_ADSENSE_ATLAS_SLOT_ID: ${{ vars.ADSENSE_ATLAS_SLOT_ID }}
          ADSENSE_GOOGLE_ADS_TXT_LINE: ${{ vars.ADSENSE_GOOGLE_ADS_TXT_LINE }}
          VUE_APP_ENABLE_MY_ATLAS_GEOGRAPHIC_PROOF: ${{ vars.MY_ATLAS_ENABLED }}
          VUE_APP_MY_ATLAS_AUTH0_DOMAIN: ${{ vars.MY_ATLAS_AUTH0_DOMAIN }}
          VUE_APP_MY_ATLAS_AUTH0_CLIENT_ID: ${{ vars.MY_ATLAS_AUTH0_CLIENT_ID }}
          VUE_APP_MY_ATLAS_AUTH0_AUDIENCE: ${{ vars.MY_ATLAS_AUTH0_AUDIENCE }}
          VUE_APP_MY_ATLAS_API_URL: ${{ vars.MY_ATLAS_API_URL }}
          VUE_APP_MY_ATLAS_PLACE_SEARCH_URL: ${{ vars.MY_ATLAS_PLACE_SEARCH_URL }}
          VUE_APP_MY_ATLAS_TURNSTILE_SITEKEY: ${{ vars.MY_ATLAS_TURNSTILE_SITEKEY }}
